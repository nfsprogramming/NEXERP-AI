name: Build & Verify

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Package Distribution Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cd dist && zip -r ../release/nexerp-web-dist.zip . && cd ..
          cd standalone && zip -r ../release/nexerp-standalone.zip . && cd ..
          cd release && sha256sum * > checksums.txt && cd ..

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nexerp-web-dist.zip
            release/nexerp-standalone.zip
            release/checksums.txt
          generate_release_notes: true

